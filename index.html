<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>James' Games</title>
  <meta name="description" content="Friends-only game servers run by James. See what's online, copy the address, and join." />
  <meta name="theme-color" content="#0F2420" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --forest:  #0F2420;
      --canopy:  #15302A;
      --ridge:   #24463D;
      --moss:    #8FD694;
      --lantern: #F2B544;
      --ember:   #E8775A;
      --sage:    #A9BCB1;
      --lichen:  #6F8B80;
      --parchment: #EFE8D8;

      --serif: "Young Serif", Georgia, serif;
      --sans:  "Hanken Grotesk", system-ui, sans-serif;

      --gutter: clamp(16px, 4vw, 56px);
      --max: 1280px;
    }

    *{ box-sizing: border-box; }
    html{ -webkit-text-size-adjust: 100%; }
    body{
      margin: 0;
      background: var(--forest);
      color: var(--parchment);
      font: 400 17px/1.55 var(--sans);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    a{ color: inherit; }
    :focus-visible{ outline: 2px solid var(--lantern); outline-offset: 3px; border-radius: 4px; }
    .wrap{ max-width: var(--max); margin: 0 auto; padding: 0 var(--gutter); }

    /* ---------- Intro + topo map ---------- */
    .top{ position: relative; isolation: isolate; }
    .topo{
      position: absolute; z-index: -1;
      inset: 0 0 -80px 0;
      width: 100%; height: calc(100% + 80px);
      pointer-events: none;
      -webkit-mask-image: linear-gradient(to bottom, #000 55%, transparent 100%);
              mask-image: linear-gradient(to bottom, #000 55%, transparent 100%);
    }
    .topo .c{
      fill: none;
      stroke: var(--sage);
      stroke-opacity: .16;
      stroke-width: 1;
    }
    .topo .maj{ stroke-opacity: .3; stroke-width: 1.4; }
    .topo.draw .c{
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: survey 2.6s cubic-bezier(.3,.6,.2,1) forwards;
      animation-delay: calc(var(--i) * 70ms);
    }
    @keyframes survey{ to{ stroke-dashoffset: 0; } }

    .bar{
      display: flex; align-items: center; justify-content: space-between;
      padding: 24px 0;
      gap: 16px;
    }
    .wordmark{
      font: 400 26px/1 var(--serif);
      text-decoration: none;
      letter-spacing: -.005em;
    }
    .bar nav{ display: flex; gap: 6px; }
    .bar nav a{
      font: 600 15px/1 var(--sans);
      text-decoration: none;
      color: var(--sage);
      padding: 10px 14px;
      border-radius: 8px;
      transition: color .15s, background .15s;
    }
    .bar nav a:hover{ color: var(--parchment); background: rgba(239,232,216,.07); }
    .bar nav a.discord{ color: var(--forest); background: var(--parchment); }
    .bar nav a.discord:hover{ background: #fff; }

    .intro{ padding: clamp(56px, 10vw, 136px) 0 clamp(48px, 7vw, 88px); }
    .intro h1{
      font: 400 clamp(48px, 7vw, 100px)/1 var(--serif);
      letter-spacing: -.02em;
      margin: 0;
      text-wrap: balance;
    }
    .intro p{
      max-width: 44ch;
      margin: 28px 0 0;
      font-size: clamp(18px, 1.6vw, 21px);
      color: var(--sage);
    }
    .pulse{
      display: inline-flex; align-items: center; gap: 12px;
      margin-top: 32px;
      padding: 10px 16px 10px 14px;
      border-radius: 18px;
      background: rgba(21,48,42,.85);
      border: 1px solid var(--ridge);
      font-weight: 600; font-size: 16px;
    }
    .pulse i{
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--moss);
      animation: beacon 2.4s ease-out infinite;
    }
    .pulse.quiet i{ background: var(--lichen); animation: none; }
    @keyframes beacon{
      0%  { box-shadow: 0 0 0 0 rgba(143,214,148,.55); }
      70% { box-shadow: 0 0 0 11px rgba(143,214,148,0); }
      100%{ box-shadow: 0 0 0 0 rgba(143,214,148,0); }
    }

    /* ---------- Server stages ---------- */
    .stages{ display: grid; gap: 28px; padding-bottom: 28px; }

    .stage{
      position: relative;
      border-radius: 22px;
      background: var(--canopy);
      border: 1px solid var(--ridge);
      box-shadow: 0 30px 60px -30px rgba(0,0,0,.6);
      transition: border-color .4s;
    }
    .stage.live{ border-color: rgba(242,181,68,.55); }

    .stage-inner{
      position: relative;
      border-radius: 21px;
      overflow: hidden;
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(340px, 1fr);
      min-height: 420px;
      background: var(--canopy);
    }
    .art{
      position: absolute; inset: 0;
      background-size: cover;
      background-position: center 35%;
      z-index: 0;
      transition: filter .6s;
    }
    .art::after{
      content: "";
      position: absolute; inset: 0;
      background:
        linear-gradient(90deg, rgba(15,36,32,.05) 0%, rgba(15,36,32,.35) 45%, rgba(21,48,42,.94) 62%, var(--canopy) 75%),
        linear-gradient(0deg, rgba(15,36,32,.75) 0%, transparent 40%);
    }
    .stage:not(.live) .art{ filter: grayscale(.85) brightness(.55); }

    .showcase{
      position: relative; z-index: 1;
      display: flex; flex-direction: column; justify-content: flex-end;
      padding: clamp(24px, 3.4vw, 44px);
      gap: 14px;
    }
    .showcase .logo{
      width: min(380px, 80%);
      max-height: 170px;
      object-fit: contain;
      object-position: left bottom;
      filter: drop-shadow(0 6px 24px rgba(0,0,0,.6));
    }
    .showcase .name{
      font: 400 clamp(48px, 6vw, 80px)/.95 var(--serif);
      margin: 0;
      text-shadow: 0 4px 30px rgba(0,0,0,.6);
    }
    .showcase .blurb{
      margin: 0;
      opacity: .88;
      max-width: 36ch;
      font-size: 16px;
      text-shadow: 0 1px 12px rgba(0,0,0,.8);
    }

    .panel{
      position: relative; z-index: 1;
      min-width: 0;
      padding: clamp(24px, 3vw, 40px);
      display: flex; flex-direction: column; gap: 22px;
      justify-content: center;
    }
    .status{
      display: inline-flex; align-items: center; gap: 10px;
      font-weight: 700; font-size: 15px;
    }
    .status::before{
      content: "";
      width: 9px; height: 9px; border-radius: 50%;
      background: currentColor;
    }
    .status.online  { color: var(--moss); }
    .status.restart { color: var(--lantern); }
    .status.offline { color: var(--ember); }
    .status.soon    { color: var(--lichen); }

    .facts{
      display: grid;
      grid-template-columns: repeat(3, auto);
      justify-content: start;
      gap: 6px 36px;
      margin: 0;
    }
    .facts div{ display: flex; flex-direction: column-reverse; gap: 4px; }
    .facts dt{ font-size: 14px; color: var(--lichen); }
    .facts dd{
      margin: 0;
      font: 800 34px/1 var(--sans);
      font-variant-numeric: tabular-nums;
      letter-spacing: -.02em;
    }
    .facts dd small{ font-size: .5em; color: var(--sage); font-weight: 700; margin-left: 2px; letter-spacing: 0; }
    .facts dd.empty{ color: var(--lichen); }

    .address{
      display: flex; align-items: stretch;
      background: rgba(15,36,32,.75);
      border: 1px solid var(--ridge);
      border-radius: 12px;
      overflow: hidden;
    }
    .address-text{
      flex: 1; min-width: 0;
      padding: 12px 16px;
      display: flex; flex-direction: column; justify-content: center;
    }
    .address-text span{ font-size: 13px; color: var(--lichen); }
    .address-text code{
      font: 600 16px/1.3 var(--sans);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      user-select: all;
    }
    .copy{
      flex: none;
      border: 0;
      border-left: 1px solid var(--ridge);
      background: transparent;
      color: var(--lantern);
      font: 700 15px/1 var(--sans);
      padding: 0 20px;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    .copy:hover{ background: rgba(242,181,68,.1); }
    .copy.done{ color: var(--moss); }

    .actions{ display: flex; flex-wrap: wrap; gap: 10px; }
    .btn{
      font: 700 16px/1 var(--sans);
      border-radius: 10px;
      padding: 15px 22px;
      cursor: pointer;
      text-decoration: none;
      border: 0;
      display: inline-flex; align-items: center; gap: 10px;
      white-space: nowrap;
      transition: transform .12s ease, background .2s;
    }
    .btn:active{ transform: translateY(1px); }
    .btn-launch{ color: #2A1D05; background: var(--lantern); }
    .btn-launch:hover{ background: #F7C462; }
    .btn-launch svg{ width: 16px; height: 16px; }
    .btn-ghost{ color: var(--parchment); background: rgba(239,232,216,.08); }
    .btn-ghost:hover{ background: rgba(239,232,216,.14); }
    .btn-ghost svg{ width: 14px; height: 14px; transition: transform .25s; }
    .btn-ghost[aria-expanded="true"] svg{ transform: rotate(180deg); }

    .steps{
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows .3s ease;
    }
    .steps.open{ grid-template-rows: 1fr; }
    .steps > div{ overflow: hidden; }
    .steps ol{
      margin: 0; padding: 4px 0 0;
      list-style: none;
      counter-reset: step;
      display: grid; gap: 12px;
    }
    .steps li{
      counter-increment: step;
      display: grid; grid-template-columns: 28px 1fr; gap: 12px;
      color: var(--sage);
      font-size: 16px;
    }
    .steps li::before{
      content: counter(step);
      width: 28px; height: 28px; border-radius: 50%;
      display: grid; place-items: center;
      font: 400 15px/1 var(--serif);
      color: var(--parchment);
      background: var(--ridge);
    }
    .steps li b{ color: var(--parchment); font-weight: 600; }

    /* Not-yet-built server: slim row, no art */
    .stage.soon{ background: transparent; border-style: dashed; box-shadow: none; }
    .stage.soon .stage-inner{
      min-height: 0;
      grid-template-columns: 1fr auto;
      align-items: center;
      background: transparent;
    }
    .stage.soon .showcase{ padding: 30px clamp(24px, 3.4vw, 44px); }
    .stage.soon .name{ font-size: clamp(36px, 4vw, 52px); color: var(--sage); text-shadow: none; }
    .stage.soon .panel{ padding: 30px clamp(24px, 3.4vw, 44px); }
    .stage.soon .blurb{ text-shadow: none; color: var(--lichen); opacity: 1; }

    /* ---------- Footer ---------- */
    footer{
      margin-top: 72px;
      border-top: 1px solid var(--ridge);
      padding: 32px 0 48px;
      display: flex; flex-wrap: wrap; gap: 16px 32px;
      justify-content: space-between; align-items: center;
      color: var(--lichen);
      font-size: 15px;
    }
    footer nav{ display: flex; gap: 22px; }
    footer a{ color: var(--sage); text-decoration: none; }
    footer a:hover{ color: var(--parchment); }

    /* ---------- Responsive ---------- */
    @media (max-width: 900px){
      .stage-inner{ grid-template-columns: minmax(0, 1fr); min-height: 0; }
      .art{ position: relative; inset: auto; height: 240px; grid-area: 1 / 1; }
      .art::after{ background: linear-gradient(0deg, var(--canopy) 0%, rgba(21,48,42,.2) 55%, transparent 100%); }
      .showcase{ grid-area: 1 / 1; padding-bottom: 12px; min-height: 240px; }
      .showcase .logo{ max-height: 110px; width: min(280px, 75%); }
      .showcase .blurb{ display: none; }
      .panel{ padding-top: 8px; }
      .stage.soon .stage-inner{ grid-template-columns: 1fr; }
      .stage.soon .showcase{ min-height: 0; padding-bottom: 0; }
      .stage.soon .panel{ padding-top: 12px; }
      .stage.soon .showcase .blurb{ display: block; }
    }
    @media (max-width: 520px){
      .wordmark{ font-size: 22px; }
      .bar nav a.src{ display: none; }
      .facts{ gap: 6px 24px; }
      .facts dd{ font-size: 28px; }
      .actions .btn{ flex: 1 1 100%; justify-content: center; }
    }

    @media (prefers-reduced-motion: reduce){
      *, *::before, *::after{ animation: none !important; transition: none !important; }
      .topo.draw .c{ stroke-dasharray: none; stroke-dashoffset: 0; }
    }
  </style>
</head>

  <div class="wrap">
    <main class="stages" id="stages" aria-label="Servers"></main>

    <footer>
      <span id="observed">Live status refreshes every minute.</span>
      <nav aria-label="Footer">
        <a href="https://discord.gg/JzhCXC2wGk" target="_blank" rel="noopener">Discord</a>
        <a href="https://github.com/dontcallmejames/james-games" target="_blank" rel="noopener">Source</a>
      </nav>
    </footer>
  </div>

  <script>
    const STEAM_ART = (id, f) => `https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/${id}/${f}`;

    const SERVERS = [
      {
        game: "Enshrouded",
        blurb: "Survival and base-building in a world swallowed by the Shroud. Up to 16 of us.",
        art:  STEAM_ART(1203620, "library_hero.jpg"),
        logo: STEAM_ART(1203620, "logo.png"),
        host: "enshrouded.dontcallmejames.com",
        port: 15637,
        status: "online",
        playersCurrent: null,
        playersMax: 16,
        pingMs: null,
        startedAt: null,
        connectUrl: "steam://run/1203620",
        steps: [
          "Copy the address above.",
          "Launch Enshrouded.",
          "Go to <b>Play</b>, then <b>Join</b>, then <b>Search by IPv4 / Domain</b>. Paste the address, or search the list for <b>James' Games</b>.",
          "Enter the password when it asks."
        ]
      },
      {
        game: "Necesse",
        blurb: "Top-down pixel survival. Build a settlement, raid dungeons, and recruit settlers.",
        art:  STEAM_ART(1169040, "library_hero.jpg"),
        logo: STEAM_ART(1169040, "logo.png"),
        host: "necesse.dontcallmejames.com",
        port: 14159,
        status: "online",
        playersCurrent: null,
        playersMax: null,
        pingMs: null,
        startedAt: null,
        connectUrl: "steam://run/1169040//-connect%20necesse.dontcallmejames.com%3A14159",
        steps: [
          "Copy the address above.",
          "Launch Necesse. <b>Launch in Steam</b> tries to join for you, but Steam sometimes skips that part.",
          "Go to <b>Multiplayer</b>, then <b>Join by IP</b>. Paste the address and join.",
          "Enter the password when it asks."
        ]
      },
      {
        game: "Hytale",
        blurb: "Next on the list. This server isn't set up yet.",
        status: "coming"
      }
    ];

    const STATUS = {
      online:      { cls: "online",  label: "Online" },
      maintenance: { cls: "restart", label: "Restarting" },
      offline:     { cls: "offline", label: "Offline" },
      coming:      { cls: "soon",    label: "Coming soon" }
    };
    const PLAY = `<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M4 2.5v11a.5.5 0 0 0 .76.43l9-5.5a.5.5 0 0 0 0-.86l-9-5.5A.5.5 0 0 0 4 2.5z"/></svg>`;

    function esc(str){
      return String(str).replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;" }[m]));
    }

    function parseSystemdTs(str){
      if (!str) return null;
      const m = str.match(/(\d{4})-(\d{2})-(\d{2})\s+(\d{2}):(\d{2}):(\d{2})\s+([A-Z]{2,5})?/);
      if (!m) return null;
      const [, Y, Mo, D, h, mi, se, tz] = m;
      const tzMap = { UTC: 0, EST: -5, EDT: -4, CST: -6, CDT: -5, MST: -7, MDT: -6, PST: -8, PDT: -7 };
      const offH = tz && tzMap[tz] != null ? tzMap[tz] : null;
      if (offH == null) return new Date(`${Y}-${Mo}-${D}T${h}:${mi}:${se}`).getTime();
      const sign = offH >= 0 ? "+" : "-";
      const abs = String(Math.abs(offH)).padStart(2, "0");
      return new Date(`${Y}-${Mo}-${D}T${h}:${mi}:${se}${sign}${abs}:00`).getTime();
    }

    function uptimeParts(s){
      const t = parseSystemdTs(s.startedAt);
      if (!t) return null;
      const sec = Math.max(0, Math.floor((Date.now() - t) / 1000));
      const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60);
      if (d) return [d, "d", h, "h"];
      if (h) return [h, "h", m, "m"];
      return [m, "m"];
    }

    function endpointOf(s){ return s.host ? (s.port ? `${s.host}:${s.port}` : s.host) : null; }

    async function copyText(text){
      try { await navigator.clipboard.writeText(text); }
      catch {
        const ta = document.createElement("textarea");
        ta.value = text; document.body.appendChild(ta); ta.select();
        document.execCommand("copy"); ta.remove();
      }
    }

    function buildStage(s, idx){
      const el = document.createElement("article");
      el.className = "stage";
      el.dataset.game = s.game;
      el.setAttribute("aria-label", s.game);

      if (s.status === "coming"){
        el.classList.add("soon");
        el.innerHTML = `
          <div class="stage-inner">
            <div class="showcase">
              <h2 class="name">${esc(s.game)}</h2>
              <p class="blurb">${esc(s.blurb)}</p>
            </div>
            <div class="panel"><span class="status soon">Coming soon</span></div>
          </div>`;
        return el;
      }

      const ep = endpointOf(s);
      const stepsId = `steps-${idx}`;
      el.innerHTML = `
        <div class="stage-inner">
          <div class="art" style="background-image:url('${s.art}')"></div>
          <div class="showcase">
            <img class="logo" src="${s.logo}" alt="${esc(s.game)}" loading="lazy" />
            <p class="blurb">${esc(s.blurb)}</p>
          </div>
          <div class="panel">
            <span class="status" data-f="status"></span>
            <dl class="facts">
              <div><dt>Playing now</dt><dd data-f="players"></dd></div>
              <div><dt>Up for</dt><dd data-f="uptime"></dd></div>
              <div><dt>Latency</dt><dd data-f="ping"></dd></div>
            </dl>
            <div class="address">
              <div class="address-text">
                <span>Server address</span>
                <code>${esc(ep)}</code>
              </div>
              <button class="copy" type="button" data-copy="${esc(ep)}">Copy</button>
            </div>
            <div class="actions">
              <a class="btn btn-launch" href="${esc(s.connectUrl)}">${PLAY}Launch in Steam</a>
              <button class="btn btn-ghost" type="button" aria-expanded="false" aria-controls="${stepsId}">How to join
                <svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 5l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
              </button>
            </div>
            <div class="steps" id="${stepsId}">
              <div><ol>${s.steps.map(t => `<li><span>${t}</span></li>`).join("")}</ol></div>
            </div>
          </div>
        </div>`;

      // If Steam's CDN doesn't serve the logo, fall back to the game's name.
      const logo = el.querySelector(".logo");
      logo.addEventListener("error", () => {
        const h = document.createElement("h2");
        h.className = "name"; h.textContent = s.game;
        logo.replaceWith(h);
      }, { once: true });

      const copyBtn = el.querySelector(".copy");
      copyBtn.addEventListener("click", async () => {
        await copyText(copyBtn.dataset.copy);
        copyBtn.textContent = "Copied";
        copyBtn.classList.add("done");
        setTimeout(() => { copyBtn.textContent = "Copy"; copyBtn.classList.remove("done"); }, 1600);
      });

      const toggle = el.querySelector(".btn-ghost");
      const steps  = el.querySelector(".steps");
      toggle.addEventListener("click", () => {
        const open = toggle.getAttribute("aria-expanded") !== "true";
        toggle.setAttribute("aria-expanded", String(open));
        steps.classList.toggle("open", open);
      });

      return el;
    }

    let statusKnown = false;

    function patchStage(el, s){
      if (s.status === "coming") return;
      const st = STATUS[s.status] || STATUS.offline;
      const live = s.status === "online";
      el.classList.toggle("live", live && statusKnown);

      const statusEl = el.querySelector('[data-f="status"]');
      statusEl.className = `status ${statusKnown ? st.cls : "soon"}`;
      statusEl.textContent = statusKnown ? st.label : "Checking…";

      const set = (f, html, empty) => {
        const dd = el.querySelector(`[data-f="${f}"]`);
        if (dd.innerHTML !== html) dd.innerHTML = html;
        dd.classList.toggle("empty", !!empty);
      };

      if (typeof s.playersCurrent === "number"){
        set("players", `${s.playersCurrent}${typeof s.playersMax === "number" ? `<small>/${s.playersMax}</small>` : ""}`);
      } else set("players", "–", true);

      const up = live ? uptimeParts(s) : null;
      if (up){
        set("uptime", up.length === 4 ? `${up[0]}<small>${up[1]}</small> ${up[2]}<small>${up[3]}</small>` : `${up[0]}<small>${up[1]}</small>`);
      } else set("uptime", "–", true);

      if (typeof s.pingMs === "number") set("ping", `${Math.round(s.pingMs)}<small>ms</small>`);
      else set("ping", "–", true);
    }

    const stagesEl = document.getElementById("stages");
    let built = false;

    function render(){
      if (!built){
        stagesEl.replaceChildren(...SERVERS.map(buildStage));
        built = true;
      }
      Array.from(stagesEl.children).forEach((el, i) => patchStage(el, SERVERS[i]));
      if (!statusKnown) return;

      const online = SERVERS.filter(s => s.status === "online");
      const playing = online.reduce((n, s) => n + (typeof s.playersCurrent === "number" ? s.playersCurrent : 0), 0);
      document.getElementById("pulse").classList.toggle("quiet", online.length === 0);
      const worlds = online.length === 1 ? "1 world is" : `${online.length} worlds are`;
      const people = playing === 1 ? "1 person playing" : `${playing} people playing`;
      document.getElementById("pulseText").textContent =
        online.length ? `${worlds} online, ${people} right now` : "Every server is offline right now";
    }

    // ---------- Live status (gist, written by the agents in /agent) ----------
    const GIST_BASE = "https://gist.githubusercontent.com/dontcallmejames/c9e5490e13425a40faecf953f838d579/raw";
    const FEEDS = { Necesse: "necesse", Enshrouded: "enshrouded" };

    async function fetchJson(url){
      try {
        const r = await fetch(`${url}?t=${Date.now()}`, { cache: "no-store" });
        return r.ok ? await r.json() : null;
      } catch { return null; }
    }

    function ago(iso){
      const diff = Math.max(0, (Date.now() - new Date(iso)) / 1000);
      if (diff < 60)    return "just now";
      if (diff < 3600)  return `${Math.floor(diff / 60)} min ago`;
      if (diff < 86400) return `${Math.floor(diff / 3600)} h ago`;
      return new Date(iso).toLocaleDateString();
    }

    async function pullLiveStatus(){
      const entries = Object.entries(FEEDS);
      const results = await Promise.all(entries.map(([, key]) => fetchJson(`${GIST_BASE}/${key}.json`)));
      const stamps = [];

      entries.forEach(([game, key], i) => {
        const data = results[i];
        const srv = SERVERS.find(x => x.game === game);
        if (!srv || !data || !data[key]) return;
        const s = data[key];
        if (s.status) srv.status = s.status;
        if (typeof s.player_count === "number") srv.playersCurrent = s.player_count;
        if (typeof s.max_players === "number") srv.playersMax = s.max_players;
        if (typeof s.upstream_ping_ms === "number") srv.pingMs = s.upstream_ping_ms;
        if (s.started_at) srv.startedAt = s.started_at;
        if (data.updated_at) stamps.push(data.updated_at);
      });

      statusKnown = true;
      if (stamps.length){
        document.getElementById("observed").textContent = `Status updated ${ago(stamps.sort().at(-1))}. Refreshes every minute.`;
      }
      render();
    }

    // One orchestrated moment: the contour lines survey themselves in, inside-out.
    const topo = document.querySelector(".topo");
    if (topo){
      topo.querySelectorAll(".c").forEach((p, i) => {
        p.setAttribute("pathLength", "1");
        p.style.setProperty("--i", String(i % 13));
      });
      topo.classList.add("draw");
    }

    render();
    pullLiveStatus();
    setInterval(pullLiveStatus, 60000);
  </script>
</body>
</html>
