<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>James' Games</title>
  <meta name="description" content="Private game servers run by James. See what's online, copy the address, and join." />
  <meta name="theme-color" content="#071214" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,500..900;1,62..125,800..900&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* Spotlight: full-bleed key art of the featured game; slanted wordmark in a glass header;
       constant brand gold, per-game accent colour. */
    :root{
      --ink: #071214;
      --ink-2: #0C1B1E;
      --fg: #F3F7F6;
      --mute: #B7C4C2;
      --faint: #7C8D8A;
      --brand: #FFC23D;
      --brand-ink: #2A1A00;
      --good: #6BE3A4;
      --warn: #FFB86B;
      --bad: #FF7A7A;

      --display: "Archivo", "Arial Black", sans-serif;
      --body: "Figtree", system-ui, sans-serif;
      color-scheme: dark;
    }
    *{ box-sizing: border-box; }
    html{ -webkit-text-size-adjust: 100%; }
    body{ margin: 0; background: var(--ink); color: var(--fg); font: 400 16px/1.5 var(--body); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
    a{ color: inherit; }
    button{ font: inherit; }
    :focus-visible{ outline: 3px solid var(--brand); outline-offset: 3px; border-radius: 6px; }
    .gutter{ padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
    .inner{ max-width: 1280px; margin: 0 auto; }

    /* ---------- Spotlight hero ---------- */
    .spot{ --acc: var(--brand); --acc-ink: var(--brand-ink); }
    .spot[data-game="Enshrouded"]{ --acc: #5FE3D0; --acc-ink: #04201C; }
    .spot[data-game="Necesse"]{ --acc: #C99BFF; --acc-ink: #1D0B33; }

    .hero{ position: relative; min-height: 720px; display: flex; flex-direction: column; overflow: hidden; isolation: isolate; }
    .art{ position: absolute; inset: 0; z-index: -2; background-size: cover; background-position: center 30%; opacity: 0; transform: scale(1.06); transition: opacity .7s ease, transform 8s ease; }
    .art.on{ opacity: 1; transform: scale(1); }
    .hero::after{
      content: ""; position: absolute; inset: 0; z-index: -1;
      background:
        linear-gradient(90deg, color-mix(in srgb, var(--ink) 92%, transparent) 0%, color-mix(in srgb, var(--ink) 55%, transparent) 42%, transparent 70%),
        linear-gradient(0deg, var(--ink) 0%, transparent 45%),
        linear-gradient(180deg, color-mix(in srgb, var(--ink) 70%, transparent) 0%, transparent 22%);
    }

    header.top{ padding-block: 18px; }
    .bar{
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 16px 14px 16px 24px;
      border-radius: 20px;
      background: color-mix(in srgb, var(--ink) 55%, transparent);
      backdrop-filter: blur(14px) saturate(1.3);
      -webkit-backdrop-filter: blur(14px) saturate(1.3);
      border: 1px solid color-mix(in srgb, var(--fg) 12%, transparent);
    }
    .bar nav{ display: flex; align-items: center; gap: 4px; }
    .bar nav a{ color: var(--mute); text-decoration: none; font-weight: 600; font-size: 15px; padding: 10px 14px; border-radius: 12px; }
    .bar nav a:hover{ color: var(--fg); background: color-mix(in srgb, var(--fg) 8%, transparent); }
    .bar nav a.discord{ color: var(--brand-ink); background: var(--brand); font-weight: 800; }
    .bar nav a.discord:hover{ background: #FFD36E; }

    /* Wordmark: slanted two-tone blocks */
    .wordmark{ text-decoration: none; display: block; }
    .badge{ display: grid; gap: 3px; transform: skewX(-12deg); }
    .badge span{ display: block; font: 900 italic 30px/1 var(--display); font-stretch: 125%; padding: 5px 12px 4px; letter-spacing: .01em; }
    .badge span:first-child{ background: var(--fg); color: var(--ink); justify-self: start; }
    .badge span:last-child{ background: var(--brand); color: var(--brand-ink); margin-left: 18px; }
    .badge b{ display: inline-block; transform: skewX(12deg); font-weight: 900; }

    .body{ flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 32px; padding-block: 40px 48px; }
    .feature{ display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; max-width: 600px; min-width: 0; }
    .feature > *{ min-width: 0; }
    .live{ display: inline-flex; align-items: center; gap: 10px; font-weight: 700; color: var(--good); }
    .live i{ width: 10px; height: 10px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 4px color-mix(in srgb, currentColor 25%, transparent); }
    .live.restart{ color: var(--warn); }
    .live.offline{ color: var(--bad); }
    .live.checking{ color: var(--faint); }
    .live.checking i{ box-shadow: none; }
    .game-logo{ width: min(460px, 90%); max-height: 190px; object-fit: contain; object-position: left bottom; filter: drop-shadow(0 8px 30px rgba(0,0,0,.7)); }
    .game-name{ font: 900 clamp(52px, 7vw, 88px)/.9 var(--display); font-stretch: 112%; margin: 0; text-shadow: 0 6px 30px rgba(0,0,0,.6); }
    .blurb{ margin: 0; font-size: 18px; color: var(--mute); max-width: 44ch; text-shadow: 0 1px 14px rgba(0,0,0,.7); }
    .stats{ display: flex; gap: 32px; flex-wrap: wrap; margin: 0; }
    .stats div{ display: flex; flex-direction: column-reverse; }
    .stats dd{ margin: 0; font: 800 34px/1 var(--display); font-stretch: 110%; font-variant-numeric: tabular-nums; }
    .stats dd small{ font-size: .55em; color: var(--mute); margin-left: 2px; }
    .stats dt{ font-size: 13px; color: var(--mute); }
    .stats .empty{ color: var(--faint); }
    .cta{ display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .btn{ border: 0; cursor: pointer; border-radius: 999px; padding: 16px 26px; font-weight: 800; font-size: 16px; text-decoration: none; background: var(--acc); color: var(--acc-ink); transition: background .6s, transform .12s; white-space: nowrap; }
    .btn:active{ transform: scale(.97); }
    .addr{ display: inline-flex; align-items: center; gap: 10px; padding: 8px 8px 8px 18px; border-radius: 999px; background: color-mix(in srgb, var(--fg) 12%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); font-weight: 600; font-size: 15px; min-width: 0; max-width: 100%; }
    .addr code{ font: inherit; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; user-select: all; }
    .addr button{ border: 0; cursor: pointer; border-radius: 999px; padding: 8px 14px; font-weight: 700; background: color-mix(in srgb, var(--fg) 18%, transparent); color: var(--fg); flex: none; }
    .addr button.done{ background: var(--good); color: #052012; }

    .thumbs{ display: grid; gap: 12px; width: 310px; align-content: end; }
    .thumbs h2{ margin: 0; font-size: 13px; color: var(--mute); font-weight: 600; }
    .thumb{ display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; align-items: center; text-align: left; border: 0; cursor: pointer; border-radius: 14px; padding: 8px; color: var(--fg); background: color-mix(in srgb, var(--ink) 55%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); outline: 2px solid transparent; transition: outline-color .3s, background .3s; }
    .thumb:hover{ background: color-mix(in srgb, var(--ink) 40%, transparent); }
    .thumb[aria-pressed="true"]{ outline-color: var(--acc); }
    .thumb .t-img{ height: 56px; border-radius: 8px; background-size: cover; background-position: center; }
    .thumb strong{ display: block; font-size: 15px; }
    .thumb small{ color: var(--mute); font-size: 13px; }
    .thumb.locked{ cursor: default; opacity: .75; }
    .thumb.locked:hover{ background: color-mix(in srgb, var(--ink) 55%, transparent); }
    .thumb.locked .t-img{ background: repeating-linear-gradient(135deg, #22303A 0 8px, #1A252D 8px 16px); display: grid; place-items: center; font-weight: 800; color: var(--mute); }

    /* ---------- How to join ---------- */
    .join{ padding-block: 64px 24px; }
    .join .inner{ display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 32px 64px; align-items: start; }
    .join h2{ font: 900 40px/1 var(--display); font-stretch: 110%; margin: 0; }
    .join .lede{ color: var(--mute); margin: 14px 0 0; max-width: 36ch; }
    .join ol{ list-style: none; margin: 0; padding: 0; counter-reset: step; display: grid; gap: 14px; }
    .join li{ counter-increment: step; display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 16px; align-items: start; padding: 18px 20px; border-radius: 16px; background: var(--ink-2); border: 1px solid color-mix(in srgb, var(--fg) 8%, transparent); color: var(--mute); }
    .join li::before{ content: counter(step); width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font: 900 20px/1 var(--display); background: var(--acc); color: var(--acc-ink); transition: background .6s; }
    .join li b{ color: var(--fg); font-weight: 700; }
    .join li span{ padding-top: 10px; }

    footer.foot{ padding-block: 48px 64px; }
    footer .row{ display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px 32px; border-top: 1px solid color-mix(in srgb, var(--fg) 12%, transparent); padding-top: 28px; color: var(--faint); font-size: 14px; }
    footer nav{ display: flex; gap: 22px; }
    footer a{ color: var(--mute); text-decoration: none; }
    footer a:hover{ color: var(--fg); }

    @media (max-width: 900px){
      .hero{ min-height: 0; }
      .body{ grid-template-columns: minmax(0, 1fr); padding-top: 140px; }
      .thumbs{ width: 100%; }
      .join .inner{ grid-template-columns: minmax(0, 1fr); }
      .bar nav a:not(.discord){ display: none; }
    }
    @media (max-width: 520px){
      .bar{ padding: 12px 10px 12px 18px; }
      .badge span{ font-size: 22px; }
      .badge span:last-child{ margin-left: 12px; }
      .bar nav a.discord{ padding: 10px 12px; font-size: 14px; }
      .stats{ gap: 24px; }
      .stats dd{ font-size: 28px; }
      .cta .btn{ flex: 1 1 100%; text-align: center; }
      .addr{ width: 100%; }
    }
    @media (prefers-reduced-motion: reduce){
      *, *::before, *::after{ transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="spot" id="spot">
    <section class="hero" aria-label="Featured server">
      <div id="arts"></div>

      <header class="top gutter"><div class="inner bar">
        <a class="wordmark" href="/" aria-label="James' Games home">
          <span class="badge" aria-hidden="true"><span><b>JAMES'</b></span><span><b>GAMES</b></span></span>
        </a>
        <nav aria-label="Main">
          <a href="#servers">Servers</a>
          <a href="#join">How to join</a>
          <a class="discord" href="https://discord.gg/JzhCXC2wGk" target="_blank" rel="noopener">Join the Discord</a>
        </nav>
      </div></header>

      <div class="gutter" style="flex:1;display:flex"><div class="inner body" style="width:100%">
        <div class="feature">
          <span class="live checking" id="status"><i></i><span id="statusText">Checking the server…</span></span>
          <div id="logoSlot"></div>
          <p class="blurb" id="blurb"></p>
          <dl class="stats">
            <div><dt>Playing now</dt><dd id="players"></dd></div>
            <div><dt>Up for</dt><dd id="uptime"></dd></div>
            <div><dt>Latency</dt><dd id="ping"></dd></div>
          </dl>
          <div class="cta">
            <a class="btn" id="launch" href="#">Launch in Steam</a>
            <span class="addr"><code id="addr"></code><button type="button" id="copy">Copy</button></span>
          </div>
        </div>
        <div class="thumbs" id="servers">
          <h2>Our servers</h2>
          <div id="thumbList" style="display:grid;gap:12px"></div>
        </div>
      </div></div>
    </section>

    <section class="join gutter" id="join" aria-labelledby="joinTitle"><div class="inner">
      <div>
        <h2 id="joinTitle">How to join</h2>
        <p class="lede" id="joinLede"></p>
      </div>
      <ol id="steps"></ol>
    </div></section>
  </div>

  <footer class="foot gutter"><div class="inner row">
    <span id="observed">Live status refreshes every minute.</span>
    <nav aria-label="Footer">
      <a href="https://discord.gg/JzhCXC2wGk" target="_blank" rel="noopener">Discord</a>
      <a href="https://github.com/dontcallmejames/james-games" target="_blank" rel="noopener">Source</a>
    </nav>
  </div></footer>

  <script>
    const STEAM_ART = (id, f) => `https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/${id}/${f}`;

    const SERVERS = [
      {
        game: "Enshrouded",
        blurb: "Survival and base-building in a world swallowed by the Shroud.",
        art:  STEAM_ART(1203620, "library_hero.jpg"),
        logo: STEAM_ART(1203620, "logo.png"),
        host: "enshrouded.dontcallmejames.com",
        port: 15637,
        status: "online",
        playersCurrent: null, playersMax: 16, pingMs: null, startedAt: null,
        connectUrl: "steam://run/1203620",
        steps: [
          "Copy the server address.",
          "Hit <b>Launch in Steam</b>, or open Enshrouded yourself.",
          "Go to <b>Play</b>, then <b>Join</b>, then <b>Search by IPv4 / Domain</b>. Paste the address, or search the list for <b>James' Games</b>.",
          "Enter the password when it asks. Ask James if you don't have it."
        ]
      },
      {
        game: "Necesse",
        blurb: "Top-down pixel survival. Build a settlement, raid dungeons, and recruit settlers.",
        art:  STEAM_ART(1169040, "library_hero.jpg"),
        logo: STEAM_ART(1169040, "logo.png"),
        host: "necesse.dontcallmejames.com",
        port: 14159,
        status: "online",
        playersCurrent: null, playersMax: null, pingMs: null, startedAt: null,
        connectUrl: "steam://run/1169040//-connect%20necesse.dontcallmejames.com%3A14159",
        steps: [
          "Copy the server address.",
          "Hit <b>Launch in Steam</b>. It tries to join for you, but Steam sometimes skips that part.",
          "If it didn't connect, go to <b>Multiplayer</b>, then <b>Join by IP</b>, paste the address and join.",
          "Enter the password when it asks. Ask James if you don't have it."
        ]
      },
      { game: "Hytale", status: "coming" }
    ];

    const STATUS = {
      online:      { cls: "",        label: (s) => `Online now, ${playersPhrase(s)}` },
      maintenance: { cls: "restart", label: () => "Restarting, back in a minute" },
      offline:     { cls: "offline", label: () => "Offline right now" }
    };

    function playersPhrase(s){
      if (typeof s.playersCurrent !== "number") return "players unknown";
      return typeof s.playersMax === "number" ? `${s.playersCurrent} of ${s.playersMax} playing` : `${s.playersCurrent} playing`;
    }
    function thumbLine(s){
      if (!statusKnown) return "Checking…";
      if (s.status === "online") return typeof s.playersCurrent === "number"
        ? `Online, ${s.playersCurrent}${typeof s.playersMax === "number" ? ` of ${s.playersMax}` : " playing"}` : "Online";
      if (s.status === "maintenance") return "Restarting";
      return "Offline";
    }

    function parseSystemdTs(str){
      if (!str) return null;
      const m = str.match(/(\d{4})-(\d{2})-(\d{2})\s+(\d{2}):(\d{2}):(\d{2})\s+([A-Z]{2,5})?/);
      if (!m) return null;
      const [, Y, Mo, D, h, mi, se, tz] = m;
      const tzMap = { UTC: 0, EST: -5, EDT: -4, CST: -6, CDT: -5, MST: -7, MDT: -6, PST: -8, PDT: -7 };
      const offH = tz && tzMap[tz] != null ? tzMap[tz] : null;
      if (offH == null) return new Date(`${Y}-${Mo}-${D}T${h}:${mi}:${se}`).getTime();
      const sign = offH >= 0 ? "+" : "-";
      const abs = String(Math.abs(offH)).padStart(2, "0");
      return new Date(`${Y}-${Mo}-${D}T${h}:${mi}:${se}${sign}${abs}:00`).getTime();
    }
    function uptimeHtml(s){
      const t = parseSystemdTs(s.startedAt);
      if (!t || s.status !== "online") return null;
      const sec = Math.max(0, Math.floor((Date.now() - t) / 1000));
      const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60);
      if (d) return `${d}<small>d</small> ${h}<small>h</small>`;
      if (h) return `${h}<small>h</small> ${m}<small>m</small>`;
      return `${m}<small>m</small>`;
    }

    const $ = (id) => document.getElementById(id);
    const spot = $("spot");
    let featured = SERVERS[0].game;
    let statusKnown = false;

    // Background art layers (one per playable server) cross-fade on switch.
    const playable = SERVERS.filter(s => s.status !== "coming");
    $("arts").replaceWith(...playable.map(s => {
      const d = document.createElement("div");
      d.className = "art"; d.dataset.art = s.game;
      d.style.backgroundImage = `url('${s.art}')`;
      return d;
    }));

    // Server list
    $("thumbList").replaceChildren(...SERVERS.map(s => {
      if (s.status === "coming"){
        const el = document.createElement("div");
        el.className = "thumb locked";
        el.innerHTML = `<span class="t-img" aria-hidden="true">?</span><span><strong>${s.game}</strong><small>Coming soon</small></span>`;
        return el;
      }
      const b = document.createElement("button");
      b.type = "button"; b.className = "thumb"; b.dataset.pick = s.game;
      b.innerHTML = `<span class="t-img" style="background-image:url('${s.art}')" aria-hidden="true"></span><span><strong>${s.game}</strong><small></small></span>`;
      b.addEventListener("click", () => { featured = s.game; render(); });
      return b;
    }));

    $("copy").addEventListener("click", async () => {
      const text = $("addr").textContent;
      try { await navigator.clipboard.writeText(text); }
      catch {
        const ta = document.createElement("textarea");
        ta.value = text; document.body.appendChild(ta); ta.select();
        document.execCommand("copy"); ta.remove();
      }
      const b = $("copy");
      b.textContent = "Copied"; b.classList.add("done");
      setTimeout(() => { b.textContent = "Copy"; b.classList.remove("done"); }, 1600);
    });

    let shownGame = null;
    function render(){
      const s = SERVERS.find(x => x.game === featured);
      spot.dataset.game = s.game;

      document.querySelectorAll(".art").forEach(a => a.classList.toggle("on", a.dataset.art === s.game));
      document.querySelectorAll(".thumb[data-pick]").forEach(b => {
        const srv = SERVERS.find(x => x.game === b.dataset.pick);
        b.setAttribute("aria-pressed", String(b.dataset.pick === s.game));
        b.querySelector("small").textContent = thumbLine(srv);
      });

      if (shownGame !== s.game){
        shownGame = s.game;
        const img = document.createElement("img");
        img.className = "game-logo"; img.src = s.logo; img.alt = s.game;
        img.addEventListener("error", () => {
          const h = document.createElement("h1"); h.className = "game-name"; h.textContent = s.game; img.replaceWith(h);
        }, { once: true });
        $("logoSlot").replaceChildren(img);
        $("blurb").textContent = s.blurb;
        $("addr").textContent = `${s.host}:${s.port}`;
        $("launch").href = s.connectUrl;
        $("launch").textContent = `Launch ${s.game} in Steam`;
        $("steps").innerHTML = s.steps.map(t => `<li><span>${t}</span></li>`).join("");
        $("joinLede").textContent = `Steps for ${s.game}. Pick another server above to see its steps.`;
      }

      const st = STATUS[s.status] || STATUS.offline;
      $("status").className = `live ${statusKnown ? st.cls : "checking"}`;
      $("statusText").textContent = statusKnown ? st.label(s) : "Checking the server…";

      const set = (id, html) => {
        const el = $(id);
        el.innerHTML = html ?? "–";
        el.classList.toggle("empty", html == null);
      };
      set("players", typeof s.playersCurrent === "number"
        ? `${s.playersCurrent}${typeof s.playersMax === "number" ? `<small>/${s.playersMax}</small>` : ""}` : null);
      set("uptime", uptimeHtml(s));
      set("ping", typeof s.pingMs === "number" ? `${Math.round(s.pingMs)}<small>ms</small>` : null);
    }

    // ---------- Live status (gist, written by the agents in /agent) ----------
    const GIST_BASE = "https://gist.githubusercontent.com/dontcallmejames/c9e5490e13425a40faecf953f838d579/raw";
    const FEEDS = { Necesse: "necesse", Enshrouded: "enshrouded" };

    async function fetchJson(url){
      try {
        const r = await fetch(`${url}?t=${Date.now()}`, { cache: "no-store" });
        return r.ok ? await r.json() : null;
      } catch { return null; }
    }
    function ago(iso){
      const diff = Math.max(0, (Date.now() - new Date(iso)) / 1000);
      if (diff < 60)    return "just now";
      if (diff < 3600)  return `${Math.floor(diff / 60)} min ago`;
      if (diff < 86400) return `${Math.floor(diff / 3600)} h ago`;
      return new Date(iso).toLocaleDateString();
    }

    let firstPull = true;
    async function pullLiveStatus(){
      const entries = Object.entries(FEEDS);
      const results = await Promise.all(entries.map(([, key]) => fetchJson(`${GIST_BASE}/${key}.json`)));
      const stamps = [];
      entries.forEach(([game, key], i) => {
        const data = results[i];
        const srv = SERVERS.find(x => x.game === game);
        if (!srv || !data || !data[key]) return;
        const s = data[key];
        if (s.status) srv.status = s.status;
        if (typeof s.player_count === "number") srv.playersCurrent = s.player_count;
        if (typeof s.max_players === "number") srv.playersMax = s.max_players;
        if (typeof s.upstream_ping_ms === "number") srv.pingMs = s.upstream_ping_ms;
        if (s.started_at) srv.startedAt = s.started_at;
        if (data.updated_at) stamps.push(data.updated_at);
      });
      statusKnown = true;

      // On first load, feature the busiest online server (ties keep list order).
      if (firstPull){
        firstPull = false;
        const online = playable.filter(s => s.status === "online");
        if (online.length){
          featured = online.reduce((best, s) => (s.playersCurrent ?? 0) > (best.playersCurrent ?? 0) ? s : best).game;
        }
      }
      if (stamps.length) $("observed").textContent = `Status updated ${ago(stamps.sort().at(-1))}. Refreshes every minute.`;
      render();
    }

    render();
    pullLiveStatus();
    setInterval(pullLiveStatus, 60000);
  </script>
</body>
</html>
