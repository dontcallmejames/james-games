<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>James' Games</title>
  <meta name="description" content="Friends-only game servers run by James. See what's online, copy the address, and join." />
  <meta name="theme-color" content="#0E0A24" />
  <link rel="icon" type="image/png" href="/favicon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --night:   #0E0A24;
      --deep:    #160F33;
      --rim:     #2B2058;
      --plasma:  #FF4FB0;
      --ion:     #45D9FF;
      --volt:    #FFC53D;
      --mist:    #C9BEEA;
      --haze:    #8E81B8;
      --paper:   #F6F2FF;
      --neon:    linear-gradient(100deg, var(--plasma) 0%, #A86BFF 50%, var(--ion) 100%);

      --display: "Big Shoulders Display", "Arial Narrow", sans-serif;
      --body:    "Hanken Grotesk", system-ui, sans-serif;

      --gutter: clamp(16px, 4vw, 56px);
      --max: 1280px;
    }

    *{ box-sizing: border-box; }
    html{ -webkit-text-size-adjust: 100%; }
    body{
      margin: 0;
      background: var(--night);
      color: var(--paper);
      font: 400 17px/1.55 var(--body);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    /* Synthwave horizon from the logo art: a faint perspective grid under the intro */
    body::before{
      content: "";
      position: absolute; inset: 0 0 auto 0;
      height: 760px;
      z-index: -1;
      background:
        radial-gradient(900px 420px at 78% 0%, rgba(255,79,176,.20), transparent 70%),
        radial-gradient(800px 380px at 10% 10%, rgba(69,217,255,.12), transparent 70%);
    }
    body::after{
      content: "";
      position: absolute; left: 0; right: 0; top: 380px;
      height: 380px;
      z-index: -1;
      background:
        linear-gradient(to bottom, var(--night) 0%, transparent 30%, transparent 70%, var(--night) 100%),
        repeating-linear-gradient(90deg, rgba(168,107,255,.16) 0 1px, transparent 1px 80px),
        repeating-linear-gradient(0deg,  rgba(168,107,255,.16) 0 1px, transparent 1px 40px);
      transform: perspective(500px) rotateX(58deg);
      transform-origin: top center;
      pointer-events: none;
    }

    a{ color: inherit; }
    :focus-visible{ outline: 2px solid var(--volt); outline-offset: 3px; border-radius: 4px; }
    .wrap{ max-width: var(--max); margin: 0 auto; padding: 0 var(--gutter); }

    /* ---------- Top bar ---------- */
    .bar{
      display: flex; align-items: center; justify-content: space-between;
      padding: 22px 0;
      gap: 16px;
    }
    .brand{ display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .brand img{ width: 40px; height: 40px; border-radius: 10px; display: block; }
    .brand span{
      font: 800 26px/1 var(--display);
      letter-spacing: .01em;
    }
    .bar nav{ display: flex; gap: 8px; }
    .bar nav a{
      font: 600 15px/1 var(--body);
      text-decoration: none;
      color: var(--mist);
      padding: 10px 14px;
      border-radius: 999px;
      transition: color .15s, background .15s;
    }
    .bar nav a:hover{ color: var(--paper); background: rgba(255,255,255,.06); }
    .bar nav a.discord{ color: var(--paper); background: rgba(255,255,255,.08); }

    /* ---------- Intro ---------- */
    .intro{ padding: clamp(48px, 9vw, 120px) 0 clamp(40px, 6vw, 72px); }
    .intro h1{
      font: 900 clamp(64px, 11vw, 148px)/.86 var(--display);
      letter-spacing: -.01em;
      margin: 0;
      max-width: 9ch;
      text-wrap: balance;
    }
    .intro h1 .bolt{
      display: inline-block;
      width: .42em; height: .78em;
      margin: 0 .04em 0 .02em;
      vertical-align: -.02em;
      color: var(--volt);
      filter: drop-shadow(0 0 14px rgba(255,197,61,.55));
    }
    .intro p{
      max-width: 46ch;
      margin: 28px 0 0;
      font-size: clamp(18px, 1.6vw, 21px);
      color: var(--mist);
    }
    .pulse{
      display: inline-flex; align-items: center; gap: 12px;
      margin-top: 30px;
      font-weight: 600;
      font-size: 16px;
      color: var(--paper);
    }
    .pulse i{
      width: 10px; height: 10px; border-radius: 50%;
      background: #45F0A0;
      box-shadow: 0 0 0 0 rgba(69,240,160,.6);
      animation: beacon 2.4s ease-out infinite;
    }
    .pulse.quiet i{ background: var(--haze); animation: none; }
    @keyframes beacon{
      0%  { box-shadow: 0 0 0 0 rgba(69,240,160,.55); }
      70% { box-shadow: 0 0 0 12px rgba(69,240,160,0); }
      100%{ box-shadow: 0 0 0 0 rgba(69,240,160,0); }
    }

    /* ---------- Server stages ---------- */
    .stages{ display: grid; gap: 28px; padding-bottom: 28px; }

    .stage{
      position: relative;
      border-radius: 22px;
      isolation: isolate;
      background: var(--deep);
    }
    /* Neon edge — the logo's stroke, lit only for live servers */
    .stage::before{
      content: "";
      position: absolute; inset: -2px;
      border-radius: 24px;
      background: var(--neon);
      z-index: -2;
      opacity: 0;
    }
    .stage::after{
      content: "";
      position: absolute; inset: -2px;
      border-radius: 24px;
      background: var(--neon);
      filter: blur(26px);
      z-index: -3;
      opacity: 0;
    }
    .stage.live::before{ opacity: 1; }
    .stage.live::after{ opacity: .45; }
    .stage.ignite::before,
    .stage.ignite::after{ animation: ignite 1.3s steps(1, end) both; animation-delay: var(--delay, 0s); }
    @keyframes ignite{
      0%  { opacity: 0; }
      12% { opacity: .9; }
      18% { opacity: .1; }
      30% { opacity: 1; }
      36% { opacity: .25; }
      48% { opacity: 1; }
      100%{ opacity: 1; }
    }
    .stage.ignite::after{ animation-name: ignite-glow; }
    @keyframes ignite-glow{
      0%,18%,36%{ opacity: 0; }
      12%,30%{ opacity: .3; }
      48%,100%{ opacity: .45; }
    }

    .stage-inner{
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(340px, 1fr);
      min-height: 420px;
      background: var(--deep);
    }
    .art{
      position: absolute; inset: 0;
      background-size: cover;
      background-position: center 35%;
      z-index: 0;
    }
    .art::after{
      content: "";
      position: absolute; inset: 0;
      background:
        linear-gradient(90deg, rgba(14,10,36,.05) 0%, rgba(14,10,36,.35) 45%, rgba(22,15,51,.94) 62%, var(--deep) 75%),
        linear-gradient(0deg, rgba(14,10,36,.75) 0%, transparent 40%);
    }
    .stage:not(.live) .art{ filter: grayscale(.85) brightness(.55); }

    .showcase{
      position: relative; z-index: 1;
      display: flex; flex-direction: column; justify-content: flex-end;
      padding: clamp(24px, 3.4vw, 44px);
      gap: 14px;
    }
    .showcase .logo{
      width: min(380px, 80%);
      max-height: 170px;
      object-fit: contain;
      object-position: left bottom;
      filter: drop-shadow(0 6px 24px rgba(0,0,0,.6));
    }
    .showcase .wordmark{
      font: 900 clamp(56px, 7vw, 96px)/.9 var(--display);
      margin: 0;
      text-shadow: 0 4px 30px rgba(0,0,0,.6);
    }
    .showcase .blurb{
      margin: 0;
      color: var(--paper);
      opacity: .85;
      max-width: 36ch;
      font-size: 16px;
      text-shadow: 0 1px 12px rgba(0,0,0,.8);
    }

    .panel{
      position: relative; z-index: 1;
      min-width: 0;
      padding: clamp(24px, 3vw, 40px);
      display: flex; flex-direction: column; gap: 22px;
      justify-content: center;
    }
    .status{
      display: inline-flex; align-items: center; gap: 10px;
      font-weight: 700; font-size: 15px;
    }
    .status svg{ width: 14px; height: 22px; }
    .status.online   { color: var(--volt); }
    .status.restart  { color: #FFB86B; }
    .status.offline  { color: #FF7A8A; }
    .status.soon     { color: var(--haze); }

    .facts{
      display: grid;
      grid-template-columns: repeat(3, auto);
      justify-content: start;
      gap: 6px 36px;
      margin: 0;
    }
    .facts div{ display: flex; flex-direction: column-reverse; }
    .facts dt{ font-size: 14px; color: var(--haze); }
    .facts dd{
      margin: 0;
      font: 800 40px/1 var(--display);
      font-variant-numeric: tabular-nums;
      letter-spacing: .01em;
    }
    .facts dd small{ font-size: .55em; color: var(--mist); font-weight: 700; margin-left: 2px; }
    .facts dd.empty{ color: var(--haze); }

    .address{
      display: flex; align-items: stretch;
      background: rgba(14,10,36,.75);
      border: 1px solid var(--rim);
      border-radius: 14px;
      overflow: hidden;
    }
    .address-text{
      flex: 1; min-width: 0;
      padding: 12px 16px;
      display: flex; flex-direction: column; justify-content: center;
    }
    .address-text span{ font-size: 13px; color: var(--haze); }
    .address-text code{
      font: 600 16px/1.3 var(--body);
      color: var(--paper);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      user-select: all;
    }
    .copy{
      flex: none;
      border: 0;
      border-left: 1px solid var(--rim);
      background: transparent;
      color: var(--ion);
      font: 700 15px/1 var(--body);
      padding: 0 20px;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    .copy:hover{ background: rgba(69,217,255,.1); }
    .copy.done{ color: #45F0A0; }

    .actions{ display: flex; flex-wrap: wrap; gap: 10px; }
    .btn{
      font: 700 16px/1 var(--body);
      border-radius: 999px;
      padding: 15px 24px;
      cursor: pointer;
      text-decoration: none;
      border: 0;
      display: inline-flex; align-items: center; gap: 10px;
      white-space: nowrap;
      transition: transform .12s ease, box-shadow .2s, background .2s;
    }
    .btn:active{ transform: translateY(1px); }
    .btn-launch{
      color: #1A0B2E;
      background: var(--volt);
      box-shadow: 0 6px 24px rgba(255,197,61,.28);
    }
    .btn-launch:hover{ box-shadow: 0 8px 32px rgba(255,197,61,.45); }
    .btn-launch svg{ width: 18px; height: 18px; }
    .btn-ghost{
      color: var(--paper);
      background: rgba(255,255,255,.07);
    }
    .btn-ghost:hover{ background: rgba(255,255,255,.12); }
    .btn-ghost svg{ width: 14px; height: 14px; transition: transform .25s; }
    .btn-ghost[aria-expanded="true"] svg{ transform: rotate(180deg); }

    .steps{
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows .3s ease;
    }
    .steps.open{ grid-template-rows: 1fr; }
    .steps > div{ overflow: hidden; }
    .steps ol{
      margin: 0; padding: 4px 0 0;
      list-style: none;
      counter-reset: step;
      display: grid; gap: 12px;
    }
    .steps li{
      counter-increment: step;
      display: grid; grid-template-columns: 30px 1fr; gap: 12px;
      color: var(--mist);
      font-size: 16px;
    }
    .steps li::before{
      content: counter(step);
      width: 30px; height: 30px; border-radius: 50%;
      display: grid; place-items: center;
      font: 800 18px/1 var(--display);
      color: var(--paper);
      background: var(--rim);
    }
    .steps li b{ color: var(--paper); font-weight: 600; }

    /* Coming-soon stage: slim, no art */
    .stage.soon .stage-inner{
      min-height: 0;
      grid-template-columns: 1fr auto;
      align-items: center;
      background:
        radial-gradient(600px 200px at 0% 0%, rgba(168,107,255,.14), transparent 70%),
        var(--deep);
      border: 1px dashed var(--rim);
    }
    .stage.soon .showcase{ padding: 32px clamp(24px, 3.4vw, 44px); }
    .stage.soon .wordmark{ font-size: clamp(44px, 5vw, 64px); color: var(--mist); text-shadow: none; }
    .stage.soon .panel{ padding: 32px clamp(24px, 3.4vw, 44px); }
    .stage.soon .blurb{ text-shadow: none; color: var(--haze); opacity: 1; }

    /* ---------- Footer ---------- */
    footer{
      margin-top: 72px;
      border-top: 1px solid var(--rim);
      padding: 32px 0 48px;
      display: flex; flex-wrap: wrap; gap: 16px 32px;
      justify-content: space-between; align-items: center;
      color: var(--haze);
      font-size: 15px;
    }
    footer nav{ display: flex; gap: 22px; }
    footer a{ color: var(--mist); text-decoration: none; }
    footer a:hover{ color: var(--paper); }

    .sr{ position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* ---------- Responsive ---------- */
    @media (max-width: 900px){
      .stage-inner{ grid-template-columns: minmax(0, 1fr); min-height: 0; }
      .art{ position: relative; inset: auto; height: 240px; grid-area: 1 / 1; }
      .art::after{ background: linear-gradient(0deg, var(--deep) 0%, rgba(22,15,51,.2) 55%, transparent 100%); }
      .showcase{ grid-area: 1 / 1; padding-bottom: 12px; min-height: 240px; }
      .showcase .logo{ max-height: 110px; width: min(280px, 75%); }
      .showcase .blurb{ display: none; }
      .panel{ padding-top: 8px; }
      .stage.soon .stage-inner{ grid-template-columns: 1fr; }
      .stage.soon .showcase{ min-height: 0; padding-bottom: 0; }
      .stage.soon .panel{ padding-top: 12px; }
      .stage.soon .showcase .blurb{ display: block; }
    }
    @media (max-width: 520px){
      .brand span{ display: none; }
      .facts{ gap: 6px 24px; }
      .facts dd{ font-size: 32px; }
      .actions .btn{ flex: 1 1 100%; justify-content: center; }
    }

    @media (prefers-reduced-motion: reduce){
      *, *::before, *::after{ animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="bar">
      <a class="brand" href="/" aria-label="James' Games home">
        <img src="favicon.png" alt="" width="40" height="40" />
        <span>James' Games</span>
      </a>
      <nav aria-label="Links">
        <a href="https://github.com/dontcallmejames/james-games" target="_blank" rel="noopener">Source</a>
        <a class="discord" href="https://discord.gg/JzhCXC2wGk" target="_blank" rel="noopener">Join the Discord</a>
      </nav>
    </header>

    <section class="intro">
      <h1>James<svg class="bolt" viewBox="0 0 24 44" aria-hidden="true"><path fill="currentColor" d="M15 0 3 25h8L7 44l15-27h-9z"/></svg> Games</h1>
      <p>Private servers for the crew. Pick a world, copy its address, and join from inside the game. Ask James for the password.</p>
      <div class="pulse quiet" id="pulse" aria-live="polite"><i></i><span id="pulseText">Checking the servers…</span></div>
    </section>

    <main class="stages" id="stages" aria-label="Servers"></main>

    <footer>
      <span id="observed">Live status refreshes every minute.</span>
      <nav aria-label="Footer">
        <a href="https://discord.gg/JzhCXC2wGk" target="_blank" rel="noopener">Discord</a>
        <a href="https://github.com/dontcallmejames/james-games" target="_blank" rel="noopener">Source</a>
      </nav>
    </footer>
  </div>

  <script>
    const STEAM_ART = (id, f) => `https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/${id}/${f}`;

    const SERVERS = [
      {
        game: "Enshrouded",
        blurb: "Survival and base-building in a world swallowed by the Shroud. Up to 16 of us.",
        art:  STEAM_ART(1203620, "library_hero.jpg"),
        logo: STEAM_ART(1203620, "logo.png"),
        host: "enshrouded.dontcallmejames.com",
        port: 15637,
        status: "online",
        playersCurrent: null,
        playersMax: 16,
        pingMs: null,
        startedAt: null,
        connectUrl: "steam://run/1203620",
        steps: [
          "Copy the address above.",
          "Launch Enshrouded.",
          "Go to <b>Play</b>, then <b>Join</b>, then <b>Search by IPv4 / Domain</b>. Paste the address, or search the list for <b>James' Games</b>.",
          "Enter the password when it asks."
        ]
      },
      {
        game: "Necesse",
        blurb: "Top-down pixel survival. Build a settlement, raid dungeons, and recruit settlers.",
        art:  STEAM_ART(1169040, "library_hero.jpg"),
        logo: STEAM_ART(1169040, "logo.png"),
        host: "necesse.dontcallmejames.com",
        port: 14159,
        status: "online",
        playersCurrent: null,
        playersMax: null,
        pingMs: null,
        startedAt: null,
        connectUrl: "steam://run/1169040//-connect%20necesse.dontcallmejames.com%3A14159",
        steps: [
          "Copy the address above.",
          "Launch Necesse. <b>Launch in Steam</b> tries to join for you, but Steam sometimes skips that part.",
          "Go to <b>Multiplayer</b>, then <b>Join by IP</b>. Paste the address and join.",
          "Enter the password when it asks."
        ]
      },
      {
        game: "Hytale",
        blurb: "Next on the list. This server isn't set up yet.",
        status: "coming"
      }
    ];

    const STATUS = {
      online:      { cls: "online",  label: "Online" },
      maintenance: { cls: "restart", label: "Restarting" },
      offline:     { cls: "offline", label: "Offline" },
      coming:      { cls: "soon",    label: "Coming soon" }
    };
    const BOLT = `<svg viewBox="0 0 24 44" aria-hidden="true"><path fill="currentColor" d="M15 0 3 25h8L7 44l15-27h-9z"/></svg>`;
    const DOT  = `<svg viewBox="0 0 14 22" aria-hidden="true"><circle cx="7" cy="11" r="5" fill="currentColor"/></svg>`;

    function esc(str){
      return String(str).replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;" }[m]));
    }

    function parseSystemdTs(str){
      if (!str) return null;
      const m = str.match(/(\d{4})-(\d{2})-(\d{2})\s+(\d{2}):(\d{2}):(\d{2})\s+([A-Z]{2,5})?/);
      if (!m) return null;
      const [, Y, Mo, D, h, mi, se, tz] = m;
      const tzMap = { UTC: 0, EST: -5, EDT: -4, CST: -6, CDT: -5, MST: -7, MDT: -6, PST: -8, PDT: -7 };
      const offH = tz && tzMap[tz] != null ? tzMap[tz] : null;
      if (offH == null) return new Date(`${Y}-${Mo}-${D}T${h}:${mi}:${se}`).getTime();
      const sign = offH >= 0 ? "+" : "-";
      const abs = String(Math.abs(offH)).padStart(2, "0");
      return new Date(`${Y}-${Mo}-${D}T${h}:${mi}:${se}${sign}${abs}:00`).getTime();
    }

    function uptimeParts(s){
      const t = parseSystemdTs(s.startedAt);
      if (!t) return null;
      const sec = Math.max(0, Math.floor((Date.now() - t) / 1000));
      const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60);
      if (d) return [d, "d", h, "h"];
      if (h) return [h, "h", m, "m"];
      return [m, "m"];
    }

    function endpointOf(s){ return s.host ? (s.port ? `${s.host}:${s.port}` : s.host) : null; }

    async function copyText(text){
      try { await navigator.clipboard.writeText(text); }
      catch {
        const ta = document.createElement("textarea");
        ta.value = text; document.body.appendChild(ta); ta.select();
        document.execCommand("copy"); ta.remove();
      }
    }

    function buildStage(s, idx){
      const el = document.createElement("article");
      el.className = "stage";
      el.dataset.game = s.game;
      el.setAttribute("aria-label", s.game);

      if (s.status === "coming"){
        el.classList.add("soon");
        el.innerHTML = `
          <div class="stage-inner">
            <div class="showcase">
              <h2 class="wordmark">${esc(s.game)}</h2>
              <p class="blurb">${esc(s.blurb)}</p>
            </div>
            <div class="panel"><span class="status soon">${DOT} Coming soon</span></div>
          </div>`;
        return el;
      }

      const ep = endpointOf(s);
      const stepsId = `steps-${idx}`;
      el.innerHTML = `
        <div class="stage-inner">
          <div class="art" style="background-image:url('${s.art}')"></div>
          <div class="showcase">
            <img class="logo" src="${s.logo}" alt="${esc(s.game)}" loading="lazy" />
            <p class="blurb">${esc(s.blurb)}</p>
          </div>
          <div class="panel">
            <span class="status" data-f="status"></span>
            <dl class="facts">
              <div><dt>Playing now</dt><dd data-f="players"></dd></div>
              <div><dt>Up for</dt><dd data-f="uptime"></dd></div>
              <div><dt>Latency</dt><dd data-f="ping"></dd></div>
            </dl>
            <div class="address">
              <div class="address-text">
                <span>Server address</span>
                <code>${esc(ep)}</code>
              </div>
              <button class="copy" type="button" data-copy="${esc(ep)}">Copy</button>
            </div>
            <div class="actions">
              <a class="btn btn-launch" href="${esc(s.connectUrl)}">${BOLT}Launch in Steam</a>
              <button class="btn btn-ghost" type="button" aria-expanded="false" aria-controls="${stepsId}">How to join
                <svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 5l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
              </button>
            </div>
            <div class="steps" id="${stepsId}">
              <div><ol>${s.steps.map(t => `<li><span>${t}</span></li>`).join("")}</ol></div>
            </div>
          </div>
        </div>`;

      // Hide the logo cleanly if Steam's CDN doesn't serve it; fall back to a wordmark.
      const logo = el.querySelector(".logo");
      logo.addEventListener("error", () => {
        const h = document.createElement("h2");
        h.className = "wordmark"; h.textContent = s.game;
        logo.replaceWith(h);
      }, { once: true });

      const copyBtn = el.querySelector(".copy");
      copyBtn.addEventListener("click", async () => {
        await copyText(copyBtn.dataset.copy);
        copyBtn.textContent = "Copied";
        copyBtn.classList.add("done");
        setTimeout(() => { copyBtn.textContent = "Copy"; copyBtn.classList.remove("done"); }, 1600);
      });

      const toggle = el.querySelector(".btn-ghost");
      const steps  = el.querySelector(".steps");
      toggle.addEventListener("click", () => {
        const open = toggle.getAttribute("aria-expanded") !== "true";
        toggle.setAttribute("aria-expanded", String(open));
        steps.classList.toggle("open", open);
      });

      return el;
    }

    function patchStage(el, s){
      if (s.status === "coming") return;
      const st = STATUS[s.status] || STATUS.offline;
      const live = s.status === "online";
      el.classList.toggle("live", live && statusKnown);

      const statusEl = el.querySelector('[data-f="status"]');
      statusEl.className = `status ${st.cls}`;
      statusEl.innerHTML = `${live ? BOLT : DOT} ${st.label}`;

      const set = (f, html, empty) => {
        const dd = el.querySelector(`[data-f="${f}"]`);
        if (dd.innerHTML !== html) dd.innerHTML = html;
        dd.classList.toggle("empty", !!empty);
      };

      if (typeof s.playersCurrent === "number"){
        set("players", `${s.playersCurrent}${typeof s.playersMax === "number" ? `<small>/${s.playersMax}</small>` : ""}`);
      } else set("players", "–", true);

      const up = live ? uptimeParts(s) : null;
      if (up){
        set("uptime", up.length === 4 ? `${up[0]}<small>${up[1]}</small> ${up[2]}<small>${up[3]}</small>` : `${up[0]}<small>${up[1]}</small>`);
      } else set("uptime", "–", true);

      if (typeof s.pingMs === "number") set("ping", `${Math.round(s.pingMs)}<small>ms</small>`);
      else set("ping", "–", true);
    }

    const stagesEl = document.getElementById("stages");
    let built = false;

    function render(){
      if (!built){
        stagesEl.replaceChildren(...SERVERS.map(buildStage));
        built = true;
      }
      Array.from(stagesEl.children).forEach((el, i) => patchStage(el, SERVERS[i]));

      const real   = SERVERS.filter(s => s.status !== "coming");
      const online = real.filter(s => s.status === "online");
      const playing = online.reduce((n, s) => n + (typeof s.playersCurrent === "number" ? s.playersCurrent : 0), 0);
      const pulse = document.getElementById("pulse");
      pulse.classList.toggle("quiet", online.length === 0);
      const worlds = online.length === 1 ? "1 world is" : `${online.length} worlds are`;
      const people = playing === 1 ? "1 person playing" : `${playing} people playing`;
      document.getElementById("pulseText").textContent =
        online.length ? `${worlds} online, ${people} right now` : "Every server is offline right now";
    }

    // ---------- Live status (gist, written by the agents in /agent) ----------
    const GIST_BASE = "https://gist.githubusercontent.com/dontcallmejames/c9e5490e13425a40faecf953f838d579/raw";
    const FEEDS = { Necesse: "necesse", Enshrouded: "enshrouded" };

    async function fetchJson(url){
      try {
        const r = await fetch(`${url}?t=${Date.now()}`, { cache: "no-store" });
        return r.ok ? await r.json() : null;
      } catch { return null; }
    }

    function ago(iso){
      const diff = Math.max(0, (Date.now() - new Date(iso)) / 1000);
      if (diff < 60)   return "just now";
      if (diff < 3600) return `${Math.floor(diff / 60)} min ago`;
      if (diff < 86400) return `${Math.floor(diff / 3600)} h ago`;
      return new Date(iso).toLocaleDateString();
    }

    let statusKnown = false;
    let firstPull = true;
    async function pullLiveStatus(){
      const entries = Object.entries(FEEDS);
      const results = await Promise.all(entries.map(([, key]) => fetchJson(`${GIST_BASE}/${key}.json`)));
      const stamps = [];

      entries.forEach(([game, key], i) => {
        const data = results[i];
        const srv = SERVERS.find(x => x.game === game);
        if (!srv || !data || !data[key]) return;
        const s = data[key];
        if (s.status) srv.status = s.status;
        if (typeof s.player_count === "number") srv.playersCurrent = s.player_count;
        if (typeof s.max_players === "number") srv.playersMax = s.max_players;
        if (typeof s.upstream_ping_ms === "number") srv.pingMs = s.upstream_ping_ms;
        if (s.started_at) srv.startedAt = s.started_at;
        if (data.updated_at) stamps.push(data.updated_at);
      });

      statusKnown = true;
      if (stamps.length){
        document.getElementById("observed").textContent = `Status updated ${ago(stamps.sort().at(-1))}. Refreshes every minute.`;
      }
      render();

      // One orchestrated moment: the neon edges of live servers flicker on, in order.
      if (firstPull){
        firstPull = false;
        let n = 0;
        stagesEl.querySelectorAll(".stage.live").forEach(el => {
          el.style.setProperty("--delay", `${0.15 + n++ * 0.35}s`);
          el.classList.add("ignite");
        });
      }
    }

    render();
    pullLiveStatus();
    setInterval(pullLiveStatus, 60000);
  </script>
</body>
</html>
